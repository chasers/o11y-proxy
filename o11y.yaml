# o11y-proxy config. Safe to commit: secrets are only ever ${ENV_VAR} references, never
# literals.
#
# Override this file's location with O11Y_PROXY_CONFIG, or drop one at
# ~/.config/o11y-proxy/config.yaml.

server:
  port: 4000
  auth: none # none | token — 'token' is the shared-deployment seam, see 04-cross-cutting.md

defaults:
  limit: 50
  max_window: 7d
  timeout: 30s
  max_bytes: 64000 # response byte ceiling; over this, records are trimmed and meta.truncated set
  # Extra attribute keys to redact, on top of the built-in list (authorization, password,
  # token, api_key, cookie, set-cookie). Matching is case/separator-insensitive and also
  # matches a key's last segment, so `http.request.header.authorization` is covered.
  redact_keys: []

# No sources configured — ClickHouse, VictoriaMetrics, Sentry, and S3 adapters all exist
# now; this file just doesn't point at any real instances. A source block looks like
# this:
