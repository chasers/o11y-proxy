#     allow_raw: true
#
#   - name: prod_metrics
#     backend: victoriametrics
#     signal: metrics
#     url: ${VM_URL}
#     allow_raw: true
#
#   # Logs that aged out of the hot store, queried in place with DuckDB. `uri` takes any
#   # path DuckDB can read — s3://, gs://, r2://, https://, or a local directory — and
#   # `format` is json, parquet or csv. Omitting the credential keys uses the AWS
#   # credential chain. `hints.hive_date_column` is what makes a time-bounded query open
