name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

# The OTP/Elixir versions below are pinned deliberately and repeated per job (GitHub
# Actions rejects unknown top-level keys, so a YAML anchor isn't available). They must
# stay in step with `.tool-versions` and `release.yml`, which explains the constraint in
# full: Burrito can only build a single-file binary for an OTP version the Beam Machine
# CDN publishes a precompiled ERTS for. Testing on a version we cannot ship a binary of
# would be testing something nobody runs.

jobs:
  checks:
    name: Checks (mix ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - name: Compile, format, lint, audit & architecture
        run: mix ci

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      # The default run only. The `clickhouse`, `victoriametrics` and `sentry` tags need
      # live backends and credentials (see `test/test_helper.exs`), so they stay opt-in and
      # are exercised locally against real instances rather than faked in CI.
      - run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Cache PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp27.3.4.16-elixir1.18.5-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp27.3.4.16-elixir1.18.5-

      - run: mix deps.get
      - run: mix dialyzer
