name: Publish release binaries

# Two ways in, both ending in the same place — binaries built, smoke-tested, and attached
# to a `v<version>` release:
#
#   * **a version bump landing on `main`** (the normal path). Bumping `version:` in
#     `mix.exs` is the whole ritual; this creates the release and builds it.
#   * **publishing a release by hand**, for a tag prepared as a draft.
#
# The release is *created here* rather than by a separate workflow, and that is not a
# stylistic choice: a release created with the built-in `GITHUB_TOKEN` does not trigger
# other workflows (GitHub's loop prevention), so a "create the release" workflow feeding a
# "build the binaries" workflow would create releases nothing ever builds. One workflow,
# one token, no PAT.
#
# Order matters too: build and smoke-test *first*, create the release *last*. A failed
# build leaves no release at all, rather than an empty one someone has to clean up.
on:
  push:
    branches: [main]
    paths: [mix.exs]
  release:
    types: [published]
  # Manual re-run, e.g. if a build failed and the release already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v0.1.0)
        required: true

permissions:
  contents: write # required to create a release and upload assets onto it

jobs:
  # Cheap gate: a push touching mix.exs is usually a dependency change, not a release.
  # Work out the tag and whether there is anything to do before booking a 5-minute build.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push)
              version=$(grep -m1 'version: "' mix.exs | sed 's/.*version: "\([^"]*\)".*/\1/')
              tag="v$version"
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Only the push path can be a no-op: `release`/`workflow_dispatch` were asked
          # for explicitly, so they always build even if the release already exists.
          if [ "$EVENT" = "push" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released — mix.exs changed for some other reason."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "will build $tag"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # The single-file binaries. Cross-compiled for all four targets from one Linux runner,
  # which is Burrito's whole trick — it fetches a precompiled ERTS per target and wraps it
  # with a Zig-built launcher.
  #
  # The Linux binaries carry DuckDB; the macOS ones do not. Burrito's ERTS is musl-linked
  # (`libc.musl-*.so.1`) and adbc's precompiled NIF is glibc-linked, so `mix duckdb.stage`
  # cross-builds the musl half first — see its moduledoc for the five pieces involved.
  # There is no darwin-native build here, so macOS binaries get their natives stripped and
  # refuse an `s3` source with a message pointing at the tarball.
  binaries:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # These versions are pinned deliberately and are not free to bump:
      #
      #   * OTP must be a version Burrito can fetch a precompiled ERTS for from the Beam
      #     Machine CDN. Not every patch release is published there — 27.3.4.17 exists
      #     upstream but 404s on the CDN, which fails the build well after setup with a
      #     confusing error. Check before bumping:
      #     https://beam-machine-universal.b-cdn.net/OTP-<version>/linux/x86_64/any/otp_<version>_linux_any_x86_64.tar.gz
      #   * Zig must be the exact version Burrito demands, which its README has been known
      #     to lag behind — trust the error message from `mix release`, not the docs.
      #
      # Keep these in sync with .tool-versions.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache deps and Burrito downloads
        uses: actions/cache@v4
        with:
          # Burrito's cache holds the fetched ERTS tarballs and musl runtime — tens of MB
          # per target, re-downloaded on every cold run otherwise.
          path: |
            deps
            _build
            ~/.cache/burrito_file_cache
          key: ${{ runner.os }}-burrito-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-burrito-

      - run: mix deps.get

      # cmake and patchelf are for `mix duckdb.stage` only; Zig above does the compiling.
      - name: Install the cross-build toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake patchelf

      # Cross-builds adbc's driver manager and NIF against musl and fetches DuckDB's own
      # musl libduckdb, so the Linux binaries get a working `s3` backend. See the task's
      # moduledoc for why each piece is needed. The macOS targets are not staged and the
      # release step strips their natives instead.
      - name: Stage musl DuckDB for the Linux targets
        run: MIX_ENV=prod mix duckdb.stage

      - name: Build all targets
        run: MIX_ENV=prod mix release --overwrite

      # The tarball this also emits is the runner's own platform and is built properly, by
      # name, in the `tarballs` matrix below. Drop it so it cannot be uploaded twice under
      # two different names.
      - name: Discard the incidental tarball
        run: rm -f _build/prod/o11y_proxy-*.tar.gz

      # Don't ship artifacts nobody has run. The runner is linux/x86_64, so the single-file
      # binary is testable here — boot it against a minimal config and require a real
      # answer from /healthz before anything is uploaded. (A bare `./o11y_proxy` with no
      # flags must stay up: see keep_alive_if_release/0.)
      - name: Smoke-test the linux x86_64 binary
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cat > "$workdir/o11y.yaml" <<'YAML'
          server:
            port: 4123
            auth: none
          sources: []
          YAML
          chmod +x burrito_out/o11y_proxy_linux_x86_64
          (cd "$workdir" && "$GITHUB_WORKSPACE/burrito_out/o11y_proxy_linux_x86_64" &)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4123/healthz > /dev/null; then
              echo "binary booted; /healthz: $(curl -s http://127.0.0.1:4123/healthz)"
              curl -sf http://127.0.0.1:4123/v1/sources > /dev/null && echo "/v1/sources ok"
              exit 0
            fi
            sleep 2
          done
          echo "binary never answered on /healthz" >&2
          exit 1

      # The whole point of `mix duckdb.stage`, pinned. This is a five-link chain — musl
      # NIF, musl driver manager, musl libduckdb under the runtime triplet's filename,
      # bundled libstdc++/libgcc_s, and `$ORIGIN` RPATHs — and every link failed at least
      # once while it was being built. Any of them regressing silently turns a working
      # binary back into one that crashes on the user's first `s3` source, so query for
      # real rather than settling for a boot.
      - name: The binary can query the s3 backend
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cp -R "$GITHUB_WORKSPACE/test/fixtures/s3" "$workdir/fixtures"
          cat > "$workdir/o11y.yaml" <<YAML
          server:
            port: 4126
            auth: none
          sources:
            - name: archive
              backend: s3
              signal: logs
              uri: $workdir/fixtures/logs/**/*.parquet
              format: parquet
              mapping:
                timestamp: ts
                severity: level
                body: message
                service: service
                attributes: attrs
              hints:
                partition_key: ts
                hive_date_column: dt
          YAML
          cd "$workdir"
          ("$GITHUB_WORKSPACE/burrito_out/o11y_proxy_linux_x86_64" serve > serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4126/healthz > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4126/healthz \
            || { echo "binary never answered on /healthz" >&2; cat serve.log >&2; exit 1; }

          body=$(curl -sf http://127.0.0.1:4126/v1/query \
            -H 'content-type: application/json' \
            -d '{"sources":["archive"],"signal":"logs","from":"2026-09-16T00:00:00Z","to":"2026-09-17T00:00:00Z","mode":"full","limit":2}')
          echo "$body"
          echo "$body" | grep -q 'payments-db connection refused' \
            || { echo "DuckDB did not answer inside the binary" >&2; cat serve.log >&2; exit 1; }
          echo "binary queried DuckDB over musl"

      # The CLI is half of what this binary is, and every bug found in it during
      # development was invisible to `mix test` because it lived in how a release boots —
      # `No file named serve` on an explicit subcommand, `--no-halt` from the tarball's
      # start script being read as one. Those only show up on the built artifact, so the
      # artifact is where they get checked.
      - name: Smoke-test the CLI subcommands
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          bin="$GITHUB_WORKSPACE/burrito_out/o11y_proxy_linux_x86_64"
          cat > "$workdir/o11y.yaml" <<'YAML'
          server:
            port: 4125
            auth: none
          sources: []
          YAML
          cd "$workdir"

          # --help/--version are ours; if Kernel.CLI ever saw them it would swallow them.
          "$bin" --version | grep -qE '^o11y-proxy [0-9]+\.[0-9]+\.[0-9]+$'
          "$bin" --help | grep -q 'USAGE'

          # Subcommands: JSON on stdout, exit 0, nothing from Kernel.CLI on stderr.
          test "$("$bin" sources 2>/dev/null)" = '{"sources":[]}'
          "$bin" health 2>/dev/null | grep -q '"sources"'
          for cmd in --version --help sources health; do
            if "$bin" "$cmd" 2>&1 | grep -q 'No file named'; then
              echo "Kernel.CLI processed our argv on: $cmd" >&2
              exit 1
            fi
          done

          # A bad command is exit 1 with a real message, not a crash and not a server.
          if "$bin" quesry > out.txt 2> err.txt; then
            echo "expected 'quesry' to exit non-zero" >&2
            cat out.txt err.txt >&2
            exit 1
          fi
          grep -q 'unknown command: quesry' err.txt
          test ! -s out.txt

          # An explicit `serve` must stay up. It is a plain argument, so it reaches
          # Kernel.CLI's error path — which halts before at_exit and killed the daemon
          # until Application.start/2 stopped returning for it.
          ("$bin" serve > serve.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4125/healthz > /dev/null; then
              echo "explicit \`serve\` stayed up: $(curl -s http://127.0.0.1:4125/healthz)"
              grep -q 'No file named' serve.log && { echo "serve printed Kernel.CLI noise" >&2; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "\`serve\` never answered on /healthz" >&2
          cat serve.log >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-binaries
          path: burrito_out/*
          if-no-files-found: error

  # The OTP release tarballs, one per platform, each built on a host of that platform.
  # This is what the `s3` backend ships in: a tarball carries the build host's own
  # glibc-linked ERTS, so adbc's DuckDB NIF loads. It is also the artifact you want under
  # systemd, since it keeps the standard `bin/o11y_proxy start|daemon|stop|remote` script
  # (Burrito binaries have no daemon/stop/remote — see keep_alive_if_release/0).
  #
  # No Intel-macOS leg: GitHub retired the `macos-13` runners, and a tarball is native by
  # construction, so there is nowhere to build one. Intel Mac users build their own with
  # `MIX_ENV=prod mix release`.
  tarballs:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-14
            platform: macos-silicon
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.18.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ matrix.platform }}-tar-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ matrix.platform }}-tar-

      - run: mix deps.get

      # O11Y_PROXY_SKIP_BURRITO drops the Burrito step (see release_steps/0 in mix.exs), so
      # these jobs need no Zig and build only what they ship.
      - name: Build the native tarball
        run: O11Y_PROXY_SKIP_BURRITO=1 MIX_ENV=prod mix release --overwrite

      - name: Name it for its platform
        run: |
          set -euo pipefail
          version=$(grep -m1 'version: "' mix.exs | sed 's/.*version: "\([^"]*\)".*/\1/')
          mkdir -p dist
          mv "_build/prod/o11y_proxy-${version}.tar.gz" \
             "dist/o11y_proxy-${version}-${{ matrix.platform }}.tar.gz"

      # Boot it, and query the `s3` backend for real against the committed Parquet fixture.
      # This is the step that proves DuckDB's NIF actually loaded on this platform — the
      # thing that does *not* hold for the single-file binaries. An empty `sources: []`
      # smoke would have shipped a broken adapter three times over.
      - name: Smoke-test the tarball, including an s3 query
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          tar xzf dist/o11y_proxy-*.tar.gz -C "$workdir"
          cp -R test/fixtures/s3 "$workdir/fixtures"
          cat > "$workdir/o11y.yaml" <<YAML
          server:
            port: 4124
            auth: none
          sources:
            - name: archive
              backend: s3
              signal: logs
              uri: $workdir/fixtures/logs/**/*.parquet
              format: parquet
              mapping:
                timestamp: ts
                severity: level
                body: message
                service: service
                attributes: attrs
              hints:
                partition_key: ts
                hive_date_column: dt
          YAML
          cd "$workdir"
          ./bin/o11y_proxy daemon
          trap './bin/o11y_proxy stop || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4124/healthz > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4124/healthz \
            || { echo "release tarball never answered on /healthz" >&2; exit 1; }

          body=$(curl -sf http://127.0.0.1:4124/v1/query \
            -H 'content-type: application/json' \
            -d '{"sources":["archive"],"signal":"logs","from":"2026-09-16T00:00:00Z","to":"2026-09-17T00:00:00Z","mode":"full","limit":2}')
          echo "$body"
          echo "$body" | grep -q 'payments-db connection refused' \
            || { echo "the s3 backend returned no rows from the fixture" >&2; exit 1; }
          echo "tarball booted and DuckDB answered"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Only now that every artifact has booted and answered. On the push path this is what
  # creates the release; on the other two it already exists and this is a no-op.
  publish:
    needs: [resolve, binaries, tarballs]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Create the release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists — uploading into it"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
            echo "created $TAG at $GITHUB_SHA"
          fi

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la dist/
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
