services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP interface — what the `ch` client and this adapter use
      - "9000:9000" # native protocol, handy for `clickhouse-client` while debugging
    environment:
      CLICKHOUSE_DB: otel_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    ports:
      - "8428:8428"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for S3 while developing the `s3` adapter. DuckDB's httpfs talks to it with
  # the same S3 API, so a source only differs from a real bucket by `endpoint`/`url_style`
  # — which is exactly the property worth testing here.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9011"
    ports:
      - "9010:9000" # S3 API — 9000 is taken by ClickHouse's native protocol above
      - "9011:9011" # web console
    environment:
      MINIO_ROOT_USER: o11yproxy
      MINIO_ROOT_PASSWORD: o11yproxy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
